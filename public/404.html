<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No-JS fallback -->
    <meta http-equiv="refresh" content="0; url=./index.html?redirect=1#/" />
    <script>
      (function () {
        var l = window.location;
        var full = l.pathname + l.search + l.hash; // bevara allt
        // Hoppa till index i samma katalog (Pages under-repo), med payload i hash
        l.replace("./index.html?redirect=1#" + encodeURIComponent(full));
      })();
    </script>
  </head>
  <body></body>
</html>
