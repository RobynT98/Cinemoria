<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=./index.html?redirect=1#~PATH~" />
    <script>
      (function () {
        var l = window.location;
        var full = l.pathname + l.search + l.hash;
        // Om meta-refresh körs utan JS, ersätt placeholdern
        var meta = document.querySelector('meta[http-equiv="refresh"]');
        if (meta) meta.setAttribute('content', '0; url=./index.html?redirect=1#' + encodeURIComponent(full));
        // Med JS: hoppa direkt
        l.replace('./index.html?redirect=1#' + encodeURIComponent(full));
      })();
    </script>
  </head>
  <body></body>
</html>
