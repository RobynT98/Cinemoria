<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=./index.html?redirect=1#~PATH~">
    <script>
      // SPA GitHub Pages fallback (rafgraph-idén i miniversion):
      (function () {
        var l = window.location;
        var path = l.pathname + l.search + l.hash;
        // Ersätt placeholder i meta-refresh om JS är av:
        document.querySelector('meta[http-equiv="refresh"]')
          ?.setAttribute('content', '0; url=./index.html?redirect=1#' + encodeURIComponent(path));
        // Och gör direkt redirect med JS:
        l.replace('./index.html?redirect=1#' + encodeURIComponent(path));
      })();
    </script>
  </head>
  <body></body>
</html>
