<!doctype html>
<html lang="sv" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c18a47" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Cinemoria</title>

    <!-- Sätt tema tidigt (stöd för dark/light/sepia) -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem('cm_theme'); // 'dark' | 'light' | 'sepia' | null
          root.classList.remove('dark', 'sepia');
          if (t === 'dark') root.classList.add('dark');
          else if (t === 'sepia') root.classList.add('sepia');
          else {
            // inget sparat -> följ system
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) root.classList.add('dark');
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>

    <!-- SPA GitHub Pages redirect fix -->
    <script>
      (function () {
        const p = new URLSearchParams(location.search);
        if (p.get("redirect") === "1" && location.hash.startsWith("#")) {
          try {
            const original = decodeURIComponent(location.hash.slice(1));
            history.replaceState(null, "", original);
          } catch {}
        }
      })();
    </script>

    <!-- Vite reskriver med base=/Cinemoria/ i build -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registrera SW relativt (rätt scope under /Cinemoria/) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      }
    </script>
  </body>
</html>
