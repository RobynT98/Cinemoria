<!doctype html>
<html lang="sv" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f2937" />
    <title>Cinemoria</title>

    <!-- Sätt tema så tidigt som möjligt för att undvika "flash" -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cm_theme'); // 'dark' | 'light' | null
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = t ? t === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', useDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>

    <!-- SPA GitHub Pages redirect fix -->
    <script>
      (function () {
        const p = new URLSearchParams(location.search);
        if (p.get("redirect") === "1" && location.hash.startsWith("#")) {
          try {
            const original = decodeURIComponent(location.hash.slice(1));
            history.replaceState(null, "", original);
          } catch {}
        }
      })();
    </script>

    <!-- Viktigt: root-path ("/"), Vite reskriver med base=/Cinemoria/ i build -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
