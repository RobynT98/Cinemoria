<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <!-- Viktigt för mobil: förhindra autozoom + använd hela skärmen -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA / iOS webapp-beteende -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Theme-färg (ljus/mörk) för statusbar -->
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <meta name="description" content="Cinemoria – din offline-katalog för film, böcker och spel." />
    <title>Cinemoria</title>

    <!-- Manifest & ev. ikoner (om du har dem i public/) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Vite mountar här -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Liten guard mot “vit skärm” vid långsam mount på vissa mobiler -->
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #0b0f14; } /* matchar dark bakgrund så tomt != vit-blänk */
      @media (prefers-color-scheme: light) {
        body { background: #ffffff; }
      }
      /* undvik dubbelscroll */
      html, body { overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
