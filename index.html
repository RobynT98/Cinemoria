<!doctype html>
<html lang="sv" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinemoria</title>

    <meta name="theme-color" content="#c18a47" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" />

    <!-- Tema tidigt -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem('cm_theme'); // 'dark' | 'light' | 'sepia'
          root.classList.remove('dark', 'sepia');
          if (t === 'dark') root.classList.add('dark');
          else if (t === 'sepia') root.classList.add('sepia');
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            root.classList.add('dark');
          }
        } catch {}
      })();
    </script>

    <!-- Minimal direkt-stil så splashen syns och kan fadas innan bundlarna laddas -->
    <style>
      html, body, #splash { margin: 0; padding: 0; height: 100%; }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;            /* light */
        z-index: 9999;                  /* ovanför allt */
        opacity: 1;                     /* synlig som default */
        transition: opacity .35s ease;  /* möjliggör fade-out direkt */
      }
      .dark #splash { background: #1f2429; }  /* dark bakgrund */
      .sepia #splash { background: #f5e6c5; } /* sepia bakgrund */

      /* Basstil så loggan syns även utan appens CSS */
      #splash .logo {
        width: 120px; height: 120px; border-radius: 24px;
      }

      /* Klass som triggas när vi ska dölja */
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>

  <body class="h-full">
    <!-- Enkel splash-overlay -->
    <div id="splash" aria-hidden="true">
      <img class="logo" src="icons/icon-192.png" alt="Cinemoria" />
    </div>

    <div id="root" class="h-full"></div>

    <!-- Ladda appen (Vite reskriver path med base vid build) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Splash fade ut -->
    <script>
      (function () {
        const splash = document.getElementById('splash');
        const root = document.getElementById('root');
        if (!splash) return;

        function hideSplash() {
          if (!splash || splash.classList.contains('hide')) return;
          splash.classList.add('hide');
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
        }

        // 1) När React har mountat något i #root – vänta en liten beat och faden
        if ('MutationObserver' in window && root) {
          const obs = new MutationObserver(() => {
            if (root.childElementCount > 0) {
              requestAnimationFrame(() => setTimeout(hideSplash, 220));
              obs.disconnect();
            }
          });
          obs.observe(root, { childList: true });
        }

        // 2) Reserv om allt redan är laddat
        window.addEventListener('load', () => setTimeout(hideSplash, 300));

        // 3) Hård timeout ifall något skulle hänga
        setTimeout(hideSplash, 2500);
      })();
    </script>
  </body>
</html>
