<!doctype html>
<html lang="sv" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinemoria</title>

    <meta name="theme-color" content="#c18a47" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" />

    <!-- Tema tidigt -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem('cm_theme');
          root.classList.remove('dark', 'sepia');
          if (t === 'dark') root.classList.add('dark');
          else if (t === 'sepia') root.classList.add('sepia');
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            root.classList.add('dark');
        } catch {}
      })();
    </script>

    <!-- Minimal direkt-stil så splashen visas direkt -->
    <style>
      html, body, #splash { margin: 0; padding: 0; height: 100%; }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .dark #splash { background: #1f2429; }
      .sepia #splash { background: #f5e6c5; }
    </style>
  </head>

  <body class="h-full">
    <div id="splash" aria-hidden="true">
      <img class="logo" src="icons/icon-192.png" alt="Cinemoria" />
    </div>

    <div id="root" class="h-full"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Splash fade ut -->
    <script>
      (function () {
        const splash = document.getElementById('splash');
        if (!splash) return;

        function hideSplash() {
          splash.classList.add('hide');
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
        }

        window.addEventListener('load', () => setTimeout(hideSplash, 150));

        if ('MutationObserver' in window) {
          const obs = new MutationObserver(() => {
            if (document.getElementById('root')?.childElementCount) {
              hideSplash();
              obs.disconnect();
            }
          });
          obs.observe(document.getElementById('root'), { childList: true });
        }

        setTimeout(hideSplash, 2000);
      })();
    </script>
  </body>
</html>
